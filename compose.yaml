services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: obsidian-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  rag-api:
    build:
      context: ./rag-api
    container_name: obsidian-rag-api
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: obsidian_chunks
      MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      VECTOR_SIZE: 384
      MODEL_CACHE_DIR: /models
      VAULT_PATH: /vault
      STATE_PATH: /state
      LAST_INDEXED_COMMIT_FILE: /state/last_indexed_commit
    ports:
      - "127.0.0.1:8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 120s
    volumes:
      - embedding_models:/models
      - rag_state:/state
      - ${OBSIDIAN_VAULT_PATH:?Set OBSIDIAN_VAULT_PATH}:/vault:ro

  mcp-server:
    build:
      context: ./mcp-server
    container_name: obsidian-mcp
    restart: unless-stopped
    depends_on:
      rag-api:
        condition: service_healthy
    environment:
      RAG_API_URL: http://rag-api:8000
    ports:
      - "127.0.0.1:8081:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: obsidian-prometheus
    restart: unless-stopped
    depends_on:
      - qdrant
      - rag-api
      - mcp-server
      - cadvisor
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:latest
    container_name: obsidian-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki

  alloy:
    profiles: ["monitoring"]
    image: grafana/alloy:latest
    container_name: obsidian-alloy
    restart: unless-stopped
    user: "0:0"
    depends_on:
      loki:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: obsidian-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:latest
    container_name: obsidian-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  qdrant_storage:
  embedding_models:
  rag_state:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
