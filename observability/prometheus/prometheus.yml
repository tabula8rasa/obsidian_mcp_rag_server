global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]

  - job_name: rag-api
    static_configs:
      - targets: ["rag-api:8000"]

  - job_name: mcp-server
    static_configs:
      - targets: ["mcp-server:8000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
